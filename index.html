<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InsideFeel 🧠✨</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --joy:#FFE135; --anger:#FF4136; --disgust:#2ECC40; --sadness:#0074D9; --fear:#B10DC9;
  --bg:#0a0a1a; --card:rgba(255,255,255,0.07); --glass:rgba(255,255,255,0.10); --white:#fff;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden;color:var(--white);}

/* BUBBLES */
.bubbles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;}
.bubble{position:absolute;border-radius:50%;opacity:0.10;animation:floatBubble linear infinite;}
@keyframes floatBubble{0%{transform:translateY(110vh) scale(0.8);opacity:0;}10%{opacity:0.10;}90%{opacity:0.10;}100%{transform:translateY(-20vh) scale(1.2);opacity:0;}}

/* FLOATING CHARS — many small ones, transparent bg */
.float-chars{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0;}
.fc{
  position:absolute;
  object-fit:contain;
  opacity:0;
  mix-blend-mode:normal;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,0.3));
  animation:fcFloat ease-in-out infinite;
}
@keyframes fcFloat{
  0%{opacity:0;transform:translateY(20px) rotate(-8deg) scale(0.9);}
  15%{opacity:0.22;}
  50%{transform:translateY(-18px) rotate(6deg) scale(1.05);opacity:0.22;}
  85%{opacity:0.22;}
  100%{opacity:0;transform:translateY(20px) rotate(-8deg) scale(0.9);}
}

/* PAGES */
.page{display:none;position:relative;z-index:1;min-height:100vh;padding:20px;justify-content:center;align-items:center;flex-direction:column;text-align:center;}
.page.active{display:flex;animation:fadeInPage 0.45s ease;}
@keyframes fadeInPage{from{opacity:0;transform:scale(0.97);}to{opacity:1;transform:scale(1);}}
@keyframes popIn{0%{transform:scale(0);opacity:0;}100%{transform:scale(1);opacity:1;}}
@keyframes slideUp{0%{transform:translateY(30px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
@keyframes wiggle{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}

/* PAGE 0 LOGIN */
#page0{background:radial-gradient(ellipse at 50% 30%,#1a0a3d 0%,#0a0a1a 70%);overflow:hidden;}
.login-card{background:var(--glass);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.15);border-radius:32px;padding:38px 34px;max-width:440px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,0.5);animation:popIn 0.7s cubic-bezier(0.34,1.56,0.64,1);position:relative;z-index:2;}
.logo-icon{font-size:64px;display:block;margin-bottom:10px;animation:wiggle 3s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(255,225,53,0.6));}
.title-main{font-family:'Fredoka One',cursive;font-size:clamp(42px,11vw,72px);background:linear-gradient(135deg,#FFE135,#FF6B9D,#00D4FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:4px;}
.tagline{font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:3px;text-transform:uppercase;margin-bottom:24px;}
.input-wrap{margin-bottom:18px;text-align:left;}
.input-wrap label{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.45);display:block;margin-bottom:7px;}
.name-input{width:100%;padding:13px 18px;border-radius:14px;background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.15);color:white;font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;outline:none;transition:all 0.3s;}
.name-input::placeholder{color:rgba(255,255,255,0.3);}
.name-input:focus{border-color:#FFE135;background:rgba(255,225,53,0.08);box-shadow:0 0 0 3px rgba(255,225,53,0.15);}
.lang-wrap{margin-bottom:26px;text-align:left;}
.lang-wrap label{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.45);display:block;margin-bottom:8px;}
.lang-opts{display:flex;gap:10px;}
.lang-btn{flex:1;padding:11px 14px;border-radius:13px;background:rgba(255,255,255,0.07);border:2px solid rgba(255,255,255,0.12);color:white;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;transition:all 0.25s;display:flex;align-items:center;justify-content:center;gap:5px;}
.lang-btn:hover{transform:scale(1.04);}
.lang-btn.active{background:rgba(0,212,255,0.15);border-color:#00D4FF;color:#00D4FF;}

/* BUTTONS */
.btn-main{font-family:'Fredoka One',cursive;font-size:18px;padding:14px 42px;border:none;border-radius:50px;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;letter-spacing:1px;}
.btn-main:hover{transform:translateY(-3px) scale(1.04);}
.btn-main:active{transform:scale(0.97);}
.btn-main.yellow{background:linear-gradient(135deg,#FFE135,#FFA500);color:#1a0a00;box-shadow:0 8px 28px rgba(255,165,0,0.5);}
.btn-main.pink{background:linear-gradient(135deg,#FF6B9D,#FF4081);color:white;box-shadow:0 8px 28px rgba(255,64,129,0.5);}
.btn-restart{font-family:'Fredoka One',cursive;font-size:16px;padding:12px 34px;border:2px solid rgba(255,255,255,0.3);border-radius:50px;background:transparent;color:white;cursor:pointer;transition:all 0.3s;letter-spacing:1px;}
.btn-restart:hover{background:rgba(255,255,255,0.1);transform:scale(1.05);border-color:rgba(255,255,255,0.6);}

/* PAGE 1 WELCOME */
#page1{background:radial-gradient(ellipse at 60% 30%,#1a0a3d 0%,#0a0a1a 70%);overflow:hidden;}
.welcome-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:26px;padding:32px 36px;max-width:480px;width:100%;animation:popIn 0.8s 0.2s both cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 20px 60px rgba(0,0,0,0.4);position:relative;z-index:2;}
.welcome-card h2{font-family:'Fredoka One',cursive;font-size:clamp(20px,5vw,27px);margin-bottom:10px;color:#FFE135;}
.welcome-card p{font-size:clamp(13px,3vw,15px);line-height:1.7;color:rgba(255,255,255,0.8);margin-bottom:8px;}
.emotion-preview{display:flex;justify-content:center;gap:8px;margin:18px 0;flex-wrap:wrap;}
.emo-chip{background:var(--card);border-radius:50px;padding:6px 13px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,0.1);transition:transform 0.2s;}
.emo-chip:hover{transform:scale(1.1);}
.emo-chip.joy{border-color:var(--joy);color:var(--joy);}
.emo-chip.anger{border-color:var(--anger);color:var(--anger);}
.emo-chip.disgust{border-color:var(--disgust);color:var(--disgust);}
.emo-chip.sadness{border-color:var(--sadness);color:var(--sadness);}

/* PAGE 2 */
#page2{background:radial-gradient(ellipse at 40% 60%,#0d1a0a 0%,#0a0a1a 70%);padding:30px 20px;}
.page-header{margin-bottom:24px;animation:popIn 0.6s both;}
.page-header .emoji-big{font-size:50px;display:block;margin-bottom:7px;}
.page-header h2{font-family:'Fredoka One',cursive;font-size:clamp(22px,6vw,36px);background:linear-gradient(135deg,#FFE135,#00D4FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.page-header p{color:rgba(255,255,255,0.5);font-size:13px;margin-top:5px;}
.personality-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;max-width:500px;width:100%;margin-bottom:26px;}
.personality-card{background:var(--card);border:2px solid rgba(255,255,255,0.1);border-radius:20px;padding:20px 12px;cursor:pointer;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);position:relative;overflow:hidden;}
.personality-card:hover{transform:scale(1.06) translateY(-4px);}
.personality-card.selected{border-width:3px;transform:scale(1.08);}
.personality-card.joy-card:hover,.personality-card.joy-card.selected{background:rgba(255,225,53,0.15);border-color:var(--joy);box-shadow:0 10px 40px rgba(255,225,53,0.3);}
.personality-card.anger-card:hover,.personality-card.anger-card.selected{background:rgba(255,65,54,0.15);border-color:var(--anger);box-shadow:0 10px 40px rgba(255,65,54,0.3);}
.personality-card.disgust-card:hover,.personality-card.disgust-card.selected{background:rgba(46,204,64,0.15);border-color:var(--disgust);box-shadow:0 10px 40px rgba(46,204,64,0.3);}
.personality-card.sadness-card:hover,.personality-card.sadness-card.selected{background:rgba(0,116,217,0.15);border-color:var(--sadness);box-shadow:0 10px 40px rgba(0,116,217,0.3);}
.personality-card .emo-img{width:80px;height:100px;object-fit:contain;margin:0 auto 9px;display:block;transition:transform 0.3s;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4));background:transparent;}
.personality-card:hover .emo-img{transform:scale(1.12) rotate(-3deg);}
.personality-card.selected .emo-img{transform:scale(1.16) rotate(3deg);}
.personality-card .card-name{font-family:'Fredoka One',cursive;font-size:16px;display:block;margin-bottom:3px;}
.personality-card .card-desc{font-size:11px;color:rgba(255,255,255,0.55);line-height:1.4;}
.joy-card .card-name{color:var(--joy);} .anger-card .card-name{color:var(--anger);}
.disgust-card .card-name{color:var(--disgust);} .sadness-card .card-name{color:var(--sadness);}
.checkmark{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;opacity:0;transition:opacity 0.3s;background:white;}
.selected .checkmark{opacity:1;}
.joy-card .checkmark{color:#8B6000;} .anger-card .checkmark{color:var(--anger);}
.disgust-card .checkmark{color:#145A32;} .sadness-card .checkmark{color:var(--sadness);}

/* PAGE 3 QUIZ */
#page3{background:radial-gradient(ellipse at 50% 50%,#1a0a2d 0%,#0a0a1a 70%);padding:20px;align-items:stretch;}
.quiz-wrapper{max-width:560px;width:100%;margin:0 auto;}
.progress-bar-wrap{background:rgba(255,255,255,0.1);border-radius:50px;height:9px;margin-bottom:7px;overflow:hidden;}
.progress-bar-fill{height:100%;border-radius:50px;background:linear-gradient(90deg,#FFE135,#FF6B9D,#00D4FF);transition:width 0.5s ease;}
.progress-label{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:18px;text-align:right;}
.question-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:26px 24px;margin-bottom:16px;animation:slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1);}
.question-num{font-family:'Fredoka One',cursive;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.32);margin-bottom:7px;}
.question-emoji{font-size:36px;display:block;margin-bottom:9px;}
.question-text{font-family:'Fredoka One',cursive;font-size:clamp(16px,4vw,21px);line-height:1.4;color:white;margin-bottom:20px;}
.answers-grid{display:flex;flex-direction:column;gap:8px;}
.answer-btn{background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.12);border-radius:13px;padding:12px 16px;color:white;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-align:left;transition:all 0.25s;display:flex;align-items:center;gap:9px;}
.answer-btn:hover{background:rgba(255,255,255,0.13);border-color:rgba(255,255,255,0.32);transform:translateX(5px);}
.answer-btn.chosen{transform:translateX(7px);}
.answer-btn.joy-ans.chosen{background:rgba(255,225,53,0.2);border-color:var(--joy);color:var(--joy);}
.answer-btn.anger-ans.chosen{background:rgba(255,65,54,0.2);border-color:var(--anger);color:#ff8a84;}
.answer-btn.disgust-ans.chosen{background:rgba(46,204,64,0.2);border-color:var(--disgust);color:#7aff8a;}
.answer-btn.sadness-ans.chosen{background:rgba(0,116,217,0.2);border-color:var(--sadness);color:#70c4ff;}
.answer-btn.fear-ans.chosen{background:rgba(177,13,201,0.2);border-color:var(--fear);color:#d96aff;}
.answer-label{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}

/* PAGE 4 RESULT */
#page4{background:radial-gradient(ellipse at 50% 30%,#1a1a0a 0%,#0a0a1a 70%);padding:30px 20px;}
.result-container{max-width:480px;width:100%;animation:popIn 0.8s cubic-bezier(0.34,1.56,0.64,1);}
.result-header{margin-bottom:18px;}
.result-header .congrats{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.38);margin-bottom:5px;}
.result-header h2{font-family:'Fredoka One',cursive;font-size:clamp(28px,7vw,46px);line-height:1.1;}
.result-char-card{border-radius:26px;padding:26px 20px;margin-bottom:18px;position:relative;overflow:hidden;border:2px solid;}
.result-char-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.05) 0%,transparent 70%);pointer-events:none;}
.result-img{width:140px;height:175px;object-fit:contain;filter:drop-shadow(0 10px 35px rgba(0,0,0,0.5));background:transparent;animation:floatResultChar 3s ease-in-out infinite;display:block;margin:0 auto 12px;}
@keyframes floatResultChar{0%,100%{transform:translateY(0px);}50%{transform:translateY(-11px);}}
.result-name{font-family:'Fredoka One',cursive;font-size:clamp(26px,7vw,40px);margin-bottom:5px;}
.result-subtitle{font-size:13px;color:rgba(255,255,255,0.58);margin-bottom:12px;font-style:italic;}
.result-desc{font-size:13px;line-height:1.7;color:rgba(255,255,255,0.83);margin-bottom:16px;}
.traits-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;}
.trait-badge{padding:5px 12px;border-radius:50px;font-size:11px;font-weight:800;border:1px solid currentColor;}
.score-bar-section{background:rgba(255,255,255,0.05);border-radius:16px;padding:16px;margin-bottom:18px;text-align:left;}
.score-bar-section h4{font-family:'Fredoka One',cursive;font-size:14px;margin-bottom:11px;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:1px;}
.score-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.score-row-label{font-size:12px;font-weight:700;width:68px;flex-shrink:0;}
.score-track{flex:1;height:7px;background:rgba(255,255,255,0.1);border-radius:50px;overflow:hidden;}
.score-fill{height:100%;border-radius:50px;transition:width 1s ease 0.5s;}
.score-pct{font-size:12px;font-weight:800;width:32px;text-align:right;}
.result-btns{display:flex;flex-direction:column;gap:10px;align-items:center;}

/* CONFETTI */
.confetti-wrap{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:hidden;}
.confetti-piece{position:absolute;animation:confettiFall 2s ease-in both;}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}
@media(max-width:400px){
  .personality-grid{gap:9px;}
  .personality-card{padding:14px 9px;}
  .personality-card .emo-img{width:65px;height:82px;}
  .question-card{padding:18px 14px;}
  .login-card{padding:26px 20px;}
}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>

<!-- PAGE 0 LOGIN -->
<div class="page active" id="page0">
  <div class="float-chars" id="fc0"></div>
  <div class="login-card">
    <span class="logo-icon">🧠</span>
    <div class="title-main">InsideFeel</div>
    <div class="tagline">Your Emotion Adventure</div>
    <div class="input-wrap">
      <label>👤 What's your name?</label>
      <input class="name-input" id="nameInput" type="text" placeholder="Type your name here..." maxlength="30" onkeydown="if(event.key==='Enter')tryLogin()">
    </div>
    <div class="lang-wrap">
      <label>🌐 Choose your language</label>
      <div class="lang-opts">
        <button class="lang-btn active" id="langEN" onclick="selectLang('en')">🇺🇸 English</button>
        <button class="lang-btn" id="langID" onclick="selectLang('id')">🇮🇩 Indonesia</button>
      </div>
    </div>
    <button class="btn-main yellow" onclick="tryLogin()">Let's Go! 🚀</button>
  </div>
</div>

<!-- PAGE 1 WELCOME -->
<div class="page" id="page1">
  <div class="float-chars" id="fc1"></div>
  <span class="logo-icon" style="position:relative;z-index:2">🧠</span>
  <div class="title-main" style="position:relative;z-index:2;margin-bottom:5px">InsideFeel</div>
  <div class="tagline" style="position:relative;z-index:2">Your Emotion Adventure Starts Here</div>
  <div class="welcome-card">
    <h2 id="welcomeTitle"></h2>
    <p id="welcomeText1"></p>
    <p id="welcomeText2"></p>
    <div class="emotion-preview">
      <span class="emo-chip joy">😄 <span id="chipJoy">Joy</span></span>
      <span class="emo-chip anger">😡 <span id="chipAnger">Anger</span></span>
      <span class="emo-chip disgust">🤢 <span id="chipDisgust">Disgust</span></span>
      <span class="emo-chip sadness">😢 <span id="chipSadness">Sadness</span></span>
    </div>
    <p id="welcomeText3" style="font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:22px;"></p>
    <button class="btn-main yellow" onclick="goToPage(2)" id="btnDiscover"></button>
  </div>
</div>

<!-- PAGE 2 PERSONALITY -->
<div class="page" id="page2">
  <div class="page-header">
    <span class="emoji-big">🪞</span>
    <h2 id="p2Title"></h2>
    <p id="p2Sub"></p>
  </div>
  <div class="personality-grid">

// FLOATING CHARS — many small scattered ones, no background
function createFloatingChars(id) {
  const c = document.getElementById(id);
  if(!c) return;
  c.innerHTML='';
  // 4 images × many positions = lots of small floating chars
  const imgs = [IMGS.joy, IMGS.anger, IMGS.disgust, IMGS.sadness];
  const count = 20; // total floating chars
  for(let i=0;i<count;i++){
    const el = document.createElement('img');
    el.src = imgs[i % imgs.length];
    el.className = 'fc';
    // random small sizes: 28px – 55px
    const size = Math.floor(Math.random()*28+28);
    const left = Math.random()*96;
    const top  = Math.random()*92;
    const dur  = 4 + Math.random()*5;
    const delay= Math.random()*6;
    const rot  = (Math.random()-0.5)*30;
    el.style.cssText = `
      width:${size}px; height:auto;
      left:${left}%; top:${top}%;
      animation-duration:${dur}s;
      animation-delay:${delay}s;
      transform-origin: center;
      --rot:${rot}deg;
    `;
    // slightly vary the keyframe by inline style override
    el.style.animationName = 'fcFloat';
    c.appendChild(el);
  }
}

function goToPage(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

  window.scrollTo(0,0);

function selectPersonality(card,type){

function shuffle(arr){return arr.sort(()=>Math.random()-0.5);}

function startQuiz(){
  currentQ=0; scores={joy:0,anger:0,disgust:0,sadness:0,fear:0};
  shuffledQuestions=shuffle([...allQuestions[lang]]).slice(0,10);
  renderQuestion(); goToPage(3);
}

function renderQuestion(){
  const q=shuffledQuestions[currentQ];
  const t=T[lang];
  const pct=((currentQ+1)/10)*100;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=t.qOf(currentQ+1,10);
  document.getElementById('questionNum').textContent=t.qLabel(currentQ+1);
  document.getElementById('questionEmoji').textContent=q.emoji;
  document.getElementById('questionText').textContent=q.text;
  const grid=document.getElementById('answersGrid');
  grid.innerHTML='';
  const labels=['A','B','C','D','E'];
  shuffle([...q.answers]).forEach((a,i)=>{
    const btn=document.createElement('button');
    btn.className=`answer-btn ${a.type}-ans`;
    btn.innerHTML=`<span class="answer-label">${labels[i]}</span>${a.text}`;
    btn.onclick=()=>selectAnswer(a.type,btn);
    grid.appendChild(btn);
  });
  const card=document.getElementById('questionCard');
  card.style.animation='none'; card.offsetHeight; card.style.animation='slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1)';
}

function selectAnswer(type,btn){
  document.querySelectorAll('.answer-btn').forEach(b=>b.classList.remove('chosen'));
  btn.classList.add('chosen'); scores[type]=(scores[type]||0)+1;
  setTimeout(()=>{currentQ++; if(currentQ<10)renderQuestion(); else showResult();},480);
}

function showResult(){
  const dominant=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
  const r=results[lang][dominant];
  const t=T[lang];
  const total=Object.values(scores).reduce((a,b)=>a+b,0);
  const sc={joy:'#FFE135',anger:'#FF4136',disgust:'#2ECC40',sadness:'#0074D9',fear:'#B10DC9'};
  let barsHtml='';
  Object.entries(scores).sort((a,b)=>b[1]-a[1]).forEach(([type,count])=>{
    const pct=Math.round((count/total)*100);
    barsHtml+=`<div class="score-row"><span class="score-row-label" style="color:${sc[type]}">${t.scoreLabels[type]}</span><div class="score-track"><div class="score-fill" style="width:${pct}%;background:${sc[type]}"></div></div><span class="score-pct" style="color:${sc[type]}">${pct}%</span></div>`;
  });
  const traitsHtml=r.traits.map(tr=>`<span class="trait-badge" style="color:${r.traitColor};border-color:${r.traitColor}">${tr}</span>`).join('');
  document.getElementById('resultContainer').innerHTML=`
    <div class="result-header">
      <div class="congrats">${t.congrats}</div>
      <h2 style="background:linear-gradient(135deg,${r.color},#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">${t.youAre}</h2>
    </div>
    <div class="result-char-card" style="background:${r.cardBg};border-color:${r.color};box-shadow:0 20px 60px ${r.color}33">
      <img src="${IMGS[r.imgKey]}" alt="${r.name}" class="result-img">
      <div class="result-name" style="color:${r.color}">${r.name}</div>
      <div class="result-subtitle">${r.subtitle}</div>
      <div class="result-desc">${r.desc}</div>
      <div class="traits-row">${traitsHtml}</div>
    </div>
    <div class="score-bar-section">
      <h4>${t.breakdown}</h4>
      ${barsHtml}
    </div>
    <div class="result-btns">
      <button class="btn-main pink" onclick="restartQuiz()">${t.btnRestart}</button>
      <button class="btn-restart" onclick="goHome()">${t.btnHome}</button>
    </div>
  `;
  goToPage(4); spawnConfetti(r.color);
}

function restartQuiz(){
  selectedPersonality=null; scores={joy:0,anger:0,disgust:0,sadness:0,fear:0}; currentQ=0;
  document.querySelectorAll('.personality-card').forEach(c=>c.classList.remove('selected'));
  const b=document.getElementById('btnStartQuiz'); b.style.opacity='0.4'; b.style.pointerEvents='none';
  document.getElementById('confettiWrap').innerHTML='';
  goToPage(2);
}

function goHome(){
  selectedPersonality=null; scores={joy:0,anger:0,disgust:0,sadness:0,fear:0}; currentQ=0;
  document.querySelectorAll('.personality-card').forEach(c=>c.classList.remove('selected'));
  const b=document.getElementById('btnStartQuiz'); b.style.opacity='0.4'; b.style.pointerEvents='none';
  document.getElementById('confettiWrap').innerHTML='';
  document.getElementById('nameInput').value='';
  createFloatingChars('fc0');
  goToPage(0);
}

function spawnConfetti(mainColor){
  const wrap=document.getElementById('confettiWrap'); wrap.innerHTML='';
  const colors=[mainColor,'#FFE135','#FF6B9D','#00D4FF','#2ECC40','#fff'];
  for(let i=0;i<70;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};width:${Math.random()*12+5}px;height:${Math.random()*12+5}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-delay:${Math.random()*2}s;animation-duration:${Math.random()*1.5+1.5}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},5000);
}
